<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <script>
      // Pick the edition before first paint: a saved choice wins, otherwise follow the system.
      (function () {
        var t = null;
        try { t = localStorage.getItem("pm:theme"); } catch (e) {}
        if (t !== "day" && t !== "night") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f0e9" />
    <meta name="description" content="A reference for aspiring and working product managers: discovery, strategy, pricing, prioritisation, specs, analytics, metrics, experimentation and launch, plus 55 frameworks, a 215-term index, learning paths and an interview prep lab." />
